[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycosa"
version = "0.2.0"
description = "Configuration sampling toolbox in Python."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Stefan Mühlbauer", email = "s.muehlbauer@mars.ucc.ie" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "z3-solver>=4.8",
    "numpy>=1.21",
    "pandas>=1.3",
    "networkx>=2.6",
    "statsmodels>=0.13",
    "xmlschema>=1.9",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]
doc = ["sphinx>=7", "furo>=2024"]
build = ["build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/smba/pycosa-toolbox"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycosa = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py39"]
